[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-core"
version = "0.1.0"
description = "Python port of pi-agent-core with LangChain LLM adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "langchain-core>=0.3.0",
    "typing-extensions>=4.6",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
deepseek = ["langchain-deepseek>=0.1.0"]
harness = ["pi-agent-harness==0.1.0"]
all = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "pi-agent-harness==0.1.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.uv.workspace]
members = ["packages/pi-agent-harness"]

[tool.uv.sources]
pi-agent-harness = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pi_agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pi_agent_core/tests", "packages/pi-agent-harness/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pi_agent_core", "pi_agent_harness"]
