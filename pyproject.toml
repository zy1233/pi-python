[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-core-lc"
version = "0.2.0"
description = "Python port of pi-agent-core with LangChain LLM adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "zy1233", email = "zy1233@users.noreply.github.com" },
]
keywords = ["agent", "llm", "langchain", "tool-use", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "langchain-core>=0.3.0",
    "typing-extensions>=4.6",
]

[project.urls]
Homepage = "https://github.com/zy1233/pi-python"
Repository = "https://github.com/zy1233/pi-python"
Issues = "https://github.com/zy1233/pi-python/issues"
Changelog = "https://github.com/zy1233/pi-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
deepseek = ["langchain-deepseek>=0.1.0"]
harness = ["pi-agent-harness-lc==0.2.0"]
cli = ["pi-agent-cli-lc==0.2.0"]
all = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "pi-agent-harness-lc==0.2.0",
    "pi-agent-cli-lc==0.2.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.16"]

[tool.uv.workspace]
members = ["packages/pi-agent-harness", "packages/pi-agent-cli"]

[tool.uv.sources]
pi-agent-harness-lc = { workspace = true }
pi-agent-cli-lc = { workspace = true }

[tool.hatch.build.targets.sdist]
exclude = ["/tui"]

[tool.hatch.build.targets.wheel]
packages = ["pi_agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pi_agent_core/tests", "packages/pi-agent-harness/tests", "packages/pi-agent-cli/tests"]
markers = ["real_llm: tests that hit a live LLM API (deselected by default)"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tui", ".pytest-audit"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pi_agent_core", "pi_agent_harness", "pi_agent_cli"]
