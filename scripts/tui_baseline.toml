# Baseline manifest for the TUI (Rust) workspace.
#
# Stage 0 of docs/PLAN/PLAN-RUST-AGENT-RUNTIME-REMOVAL.md. Read by scripts/tui_baseline.py and
# .github/workflows/tui-ci.yml; the human-readable report is docs/baselines/tui.md.
#
# Ratchet rules: ceilings (graph nodes, warnings) only go down, floors (tests) only go up. A key
# that is absent means "report only". Values tagged PROVISIONAL were measured on macOS or
# cross-resolved and are meant to be replaced by the first Linux CI run (see the report doc).

[toolchain]
# Must equal `channel` in tui/rust-toolchain.toml (scripts/tests/test_tui_baseline.py checks it).
channel = "1.94.0"

[gates]
# `cargo tree -p pi-pager-bin -i <crate>` must fail with "did not match any packages", and the
# crate must not appear in tui/Cargo.lock.
deny_crates = ["pi-sampler"]
# Whole-word matches anywhere under tui/crates are runtime remnants and fail the gate.
deny_words = ["MvpAgent", "acp_session_impl", "SamplerActor"]
# Present on purpose; the report lists their direct dependents (reasons: docs/baselines/tui.md).
tracked_crates = [
    "async-openai",
    "pi-sampling-types",
    "pi-tools",
    "pi-agent",
    "pi-workspace",
    "pi-hooks",
    "pi-mcp",
]

# Plan phase C asked for zero hits of `grok agent`, `leader`, `x.ai` and `MvpAgent`. `MvpAgent` is
# a deny word above, and `grok agent` is at zero. The other two still occur, on purpose or in code
# that phase D removes (docs/baselines/tui.md section 4 says what is left and why). Each phrase has
# a ceiling: lines under tui/crates that hold it, ignoring case, with no letter or digit right before
# it (`x.ai` does not match in `max.ai`). A ceiling only goes down; lower it in the commit that
# removes lines.
[gates.residue]
"grok agent" = 0
"leader" = 243
"x.ai" = 297

# ADR1 (plan section 10.16): the pager asks the agent which sessions exist (`session/list`) and
# reads no session files itself. Production code in these crates (paths under tui/crates) must
# not call the readers of `pi-shell`'s session store, nor name the sessions directory. Skipped:
# test files (`tests.rs`, `*_tests.rs`, `test_util.rs`, `tests/` directories), inline
# `#[cfg(test)] mod ... {}` blocks, and comment lines. The patterns are plain substrings. The
# session store of `pi-shell` (`session::storage`, `session::persistence`) is deleted (plan
# decision 10); the patterns stay as a guard against writing it back. `session::title` is not
# listed: `sanitize_and_cap_title` and `is_forbidden_title_char` are pure string helpers that the
# pager uses on purpose.
[gates.session_disk_reads]
crates = ["codegen/pi-pager", "codegen/pi-pager-bin"]
patterns = [
    "list_summaries",
    "resolve_local_session",
    "session_exists_for_cwd",
    "resumed_session_sandbox_profile",
    "local_summaries_for_cwd_sync",
    "session::storage",
    "persistence::session_dir",
    'join("sessions")',
]

[graph]
package = "pi-pager-bin"

# Ceiling for the number of unique packages in `cargo tree -p pi-pager-bin --target <triple>`.
[graph.max_nodes]
# Measured on the Linux runner (TUI CI run 37379203134, commit 0e71894): 980, down from 995 after
# the unused-dependency sweep and the removal of pi-memory / pi-fsnotify. Then 970 (plan r16: ten
# packages left when `pi-shell` dropped the dependencies that no source file named: `pi-workflow`
# and nine registry packages; one local run on Linux). A new dependency has to lower the count
# elsewhere or raise this number on purpose.
x86_64-unknown-linux-gnu = 970

[check]
# Consumer build: everything that ships (`zypi`, the minimal pager, the updater).
packages = ["pi-pager-bin", "pi-pager-minimal", "pi-update"]
# Warning ceiling across those packages. Linux and macOS both show 0: the crate-root
# `#![allow(dead_code, ...)]` attributes are gone (plan A.4) and the code they hid was deleted.
max_warnings = 0
# `cargo check --workspace --tests --keep-going` type-checks every crate's tests, which is where
# Linux-only cfg code that macOS never compiled would break.
workspace_tests = true
# pi-fast-worktree: lib tests do not compile at HEAD (`nfs::confined::tests::plant_journal`).
workspace_tests_exclude = ["pi-fast-worktree"]
# The first Linux run was green (0 errors).
enforce_workspace_tests = true

[test]
# "nextest" (cargo-nextest, one process per test) or "cargo" (libtest, all tests of a binary as
# threads of one process). The vendored tests were written for nextest, and some of them are
# reliable only under it (docs/PLAN/PLAN-RUST-AGENT-RUNTIME-REMOVAL.md, sections 10.20 and
# 10.21). The command line `--runner` takes the other one. nextest counts the ignored tests and
# the tests that `skip` removes together as skipped, and it runs no doctests (these suites select
# explicit targets, so `cargo test` did not run them either).
runner = "nextest"
# The first Linux run passed every suite with 0 failures, so unexpected failures now block.
enforce = true
timeout_minutes = 60
# Several pager tests assert colour / cursor output and need a capable terminal environment.
# The home / agent / sandbox variables are unset so a developer's shell cannot change results
# (`PI_HOME` outranks the `GROK_HOME` that the config-isolation tests set for themselves).
unset_env = ["NO_COLOR", "PI_HOME", "GROK_HOME", "PI_AGENT_COMMAND", "PI_PYTHON", "GROK_SANDBOX"]

[test.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

# `reference_passed` is the Linux CI result of the last recorded run (TUI CI run 37389455793,
# commit ac1d3ff; docs/baselines/tui.md); the summary flags a run that deviates by more than 5 %.
# `min_passed` (floor) is that run minus a few percent: deleting dead code legitimately deletes
# its tests, but a drop below the floor has to be a deliberate edit of this file. Both numbers
# are measured on Linux; macOS runs a handful of platform-specific tests more or fewer.

[[test.suite]]
package = "pi-shell"
targets = ["--lib", "--test", "sandbox_requirements_pin", "--test", "test_config_update_isolation"]
# 1,056 before plan decision 10 (r15) deleted the session store of `pi-shell` and the state types
# that only it used. The deleted files held 202 tests (one of them compiles only on macOS), and 9
# new ones came (the title helpers and the verdict): 1,056 - 201 + 9 = 864 on Linux. Then plan r16
# deleted `session::worktree` (24 tests, Unix only), `session::helpers` (2) and
# `util::config::worktree` (1), and added 1 (a `[storage]` section is reported as unrecognized):
# 864 - 24 - 2 - 1 + 1 = 838 on Linux (one local run). The ten reference numbers add up to 8,490.
reference_passed = 838
min_passed = 820

[[test.suite]]
package = "pi-pager"
targets = [
    "--lib",
    "--test",
    "settings_e2e",
    "--test",
    "grok_home_paths",
    "--test",
    "selection_model_public_api",
    # The pager's ACP client against the real Python agent (plan 0.3). It needs a Python that has
    # pi_agent_cli installed: PI_E2E_PYTHON names it, and PI_E2E_REQUIRED=1 (set by tui-ci.yml and
    # tui-e2e.yml) makes a missing one a failure; without either the tests say so and pass, so a
    # developer who has no such Python can still run the manifest.
    "--test",
    "python_agent_e2e",
]
# 5,559 in the last CI run before r8 (33374a3, `doctor_cmd::` skipped) plus the 12 `doctor_cmd::`
# tests plus the 6 `agent_stderr` tests of the agent's stderr log: 5,577 (the second CI run of
# PR #9; the first failed one doctor test that counted the issue the voice probe adds on a host
# with no recorder on PATH, as the runner is; plan section 10.10, "CI results"). Since then:
# +10 `python_agent_e2e` (that test target; on a host where `PI_E2E_PYTHON` is unset they pass as
# skips), +8 `agent_exit_tests` (the agent's exit notice), +6 `fetch_session_list_*` (cursor
# following) and +1 `session_new_and_load_send_no_mcp_servers`: 5,602 (one local run on Linux,
# plan section 10.11; PR #10's CI run counted the same 5,602, 8,659 over the ten suites). Then
# +24 for offering only the permission modes the agent honours (21 lib tests, 3 `settings_e2e`):
# 5,626 (one local run on Linux, plan section 10.13; PR #12's CI run counted the same 5,626,
# 8,683 over the ten suites). Then -18 net for the embedded user guide (plan section 10.14): the
# tutorial overlay (`views/tutorial.rs`, `tutorial_docs.rs`) and the tests of the upstream guide
# are gone, and the seven zypi pages have two guard tests: 5,608 (one local run on Linux; 8,665
# over the ten suites, the other nine unchanged). Then +35 from #18 (19 tests: `zypi export` asks
# the agent) and #19 (16 tests: the status line), counted by CI at `1fa18cf` as 5,643 (8,700 over
# the ten suites; this number was not changed then). Then +32 for resolving the start-up session
# through `session/list` (plan section 10.16, ADR1 PR 2: 25 `session_resolve`, 4 `bounded_resolve`,
# 3 `python_agent_e2e`): 5,675. Then -26 passed and -1 ignored with the code that read the session
# files (ADR1 PR 3; 27 tests went with the code): 5,649 (one local run on Linux; 8,706 over the
# ten suites, the other nine unchanged). Then +2 for the self-tests of `in_own_process`, the helper
# that runs a test in a process of its own (plan section 10.20): 5,651 (one local run on Linux;
# 8,490 over the ten suites, the other nine unchanged). Then +5 for hiding the eight settings that
# the Python agent does not back (3 in `app::agent_settings`, 2 in `settings_modal`): 5,656 (one
# local run on Linux; 8,505 over the ten suites with the 10 new ones of `pi-pager-bin`).
reference_passed = 5656
min_passed = 5300

# Lib tests only; they were outside the manifest until r8 (plan section 10.10: 1,092 passed,
# 2 ignored on Linux, 1.4 s).
[[test.suite]]
package = "pi-pager-render"
targets = ["--lib"]
# Burns 1.2 s of a 1.5 s budget in a shell script, so it fails when the machine stalls. It failed
# twice on WSL2, both times on the first run after the test binary was linked (the
# one-crate-at-a-time sweep, then the first manifest run), and never in the 94 runs after that,
# idle or with every core busy. Tolerated rather than skipped: the report still names it when it
# fails, so a test that fails on every run is visible, but it does not block.
known_failures = ["tmux_probe::tests::successful_near_deadline_exit_still_returns_captured_output"]
reference_passed = 1092
min_passed = 1040

# Lib tests only (79 passed on Linux). Its diff-background test used to fail under the default
# thread count for want of the theme lock; with the lock it is stable (40/40 in each mode).
[[test.suite]]
package = "pi-pager-minimal"
targets = ["--lib"]
reference_passed = 79
min_passed = 75

[[test.suite]]
package = "pi-pager-bin"
targets = ["--bin", "zypi"]
# tests/update_never_blocked_by_config.rs is not selected: it looks for CARGO_BIN_EXE_pi-pager,
# but the binary is named zypi (fork-rename leftover, unrelated to the runtime removal).
# 20 in the last CI run plus the test that names zypi as the agent's parent in `-p` mode. Then +10
# for the flags that an interactive session refuses (`interactive_flags`): 31 (one local run on
# Linux).
reference_passed = 31
min_passed = 31

[[test.suite]]
package = "pi-acp-lib"
targets = ["--lib"]
# The x.ai drop test hangs forever: acp::ExtRequest serialises `method` away, so the drop logic
# never fires and the queued request is never answered (docs/PLAN/... section 10.4).
skip = ["vendor_x_ai_ext_is_dropped_without_sending"]
reference_passed = 21
min_passed = 21

[[test.suite]]
package = "pi-http"
targets = ["--lib"]
reference_passed = 13
min_passed = 13

[[test.suite]]
package = "pi-telemetry"
targets = ["--lib"]
reference_passed = 239
min_passed = 230

[[test.suite]]
package = "pi-file-utils"
targets = ["--lib"]
reference_passed = 216
min_passed = 210

[[test.suite]]
package = "pi-sampling-types"
targets = ["--lib"]
reference_passed = 320
min_passed = 310

# The sandbox: its lib tests and the four end-to-end files (`deny_paths_e2e` needs `bwrap` on
# Linux; `landlock_enforcement_e2e` and `read_write_trailing_glob_e2e` need Landlock). The files
# skip on a host that cannot enforce, and pass: only `SANDBOX_E2E_REQUIRE_ENFORCEMENT` turns the
# skip into a failure. tui-ci.yml sets it for the `test` job, installs `bubblewrap` and lifts the
# AppArmor block on unprivileged user namespaces of ubuntu-24.04 (plan section 10.28). A local run
# without the variable on a host without `bwrap` still passes, but the floor below is only the
# count of the passing tests, so it cannot tell. The CI result is the one that counts.
[[test.suite]]
package = "pi-sandbox"
targets = [
    "--lib",
    "--test",
    "deny_paths_e2e",
    "--test",
    "integration_test",
    "--test",
    "landlock_enforcement_e2e",
    "--test",
    "read_write_trailing_glob_e2e",
]
reference_passed = 105
min_passed = 100

[release]
profile = "release-dist"
package = "pi-pager-bin"
binary = "zypi"

# Pre-removal reference: the v0.4.0 release (tui/ identical to commit 07a3574), job "Build TUI
# binary (Linux x86_64)" on ubuntu-24.04 with a cold cache. The binary must not grow.
[release.reference]
size_bytes = 470461776
build_seconds = 1647 # "Finished `release-dist` profile ... in 27m 27s"
