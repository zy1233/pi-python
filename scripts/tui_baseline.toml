# Baseline manifest for the TUI (Rust) workspace.
#
# Stage 0 of docs/PLAN/PLAN-RUST-AGENT-RUNTIME-REMOVAL.md. Read by scripts/tui_baseline.py and
# .github/workflows/tui-ci.yml; the human-readable report is docs/baselines/tui.md.
#
# Ratchet rules: ceilings (graph nodes, warnings) only go down, floors (tests) only go up. A key
# that is absent means "report only". Values tagged PROVISIONAL were measured on macOS or
# cross-resolved and are meant to be replaced by the first Linux CI run (see the report doc).

[toolchain]
# Must equal `channel` in tui/rust-toolchain.toml (scripts/tests/test_tui_baseline.py checks it).
channel = "1.94.0"

[gates]
# `cargo tree -p pi-pager-bin -i <crate>` must fail with "did not match any packages", and the
# crate must not appear in tui/Cargo.lock.
deny_crates = ["pi-sampler", "async-openai"]
# Whole-word matches anywhere under tui/crates are runtime remnants and fail the gate.
deny_words = ["MvpAgent", "acp_session_impl", "SamplerActor"]
# Present on purpose; the report lists their direct dependents (reasons: docs/baselines/tui.md).
tracked_crates = [
    "pi-sampling-types",
    "pi-tools",
    "pi-agent",
    "pi-workspace",
    "pi-hooks",
    "pi-mcp",
]

# Plan phase C asked for zero hits of `grok agent`, `leader`, `x.ai` and `MvpAgent`. `MvpAgent` is
# a deny word above, and `grok agent` is at zero. The other two still occur, on purpose or in code
# that phase D removes (docs/baselines/tui.md section 4 says what is left and why). Each phrase has
# a ceiling: lines under tui/crates that hold it, ignoring case, with no letter or digit right before
# it (`x.ai` does not match in `max.ai`). A ceiling only goes down; lower it in the commit that
# removes lines.
[gates.residue]
"grok agent" = 0
"leader" = 213
"x.ai" = 240

# ADR1 (plan section 10.16): the pager asks the agent which sessions exist (`session/list`) and
# reads no session files itself. Production code in these crates (paths under tui/crates) must
# not call the readers of `pi-shell`'s session store, nor name the sessions directory. Skipped:
# test files (`tests.rs`, `*_tests.rs`, `test_util.rs`, `tests/` directories), inline
# `#[cfg(test)] mod ... {}` blocks, and comment lines. The patterns are plain substrings. The
# session store of `pi-shell` (`session::storage`, `session::persistence`) is deleted (plan
# decision 10); the patterns stay as a guard against writing it back. `session::title` is not
# listed: `sanitize_and_cap_title` and `is_forbidden_title_char` are pure string helpers that the
# pager uses on purpose.
#
# The pager also writes nothing into the sessions directory (audit AUDIT-RUST-RUNTIME-REMOVAL
# F-2): the agent owns that directory, and it deletes a session without knowing the files of the
# pager. The pasted images and the diagram cache were there until r45, and this gate did not look
# at the two crates that built their path (`pi-pager-render`, `pi-shared`). They are in the list
# now, with the helpers that build a path in the sessions directory (`sessions_cwd_dir`, which
# also matches `ensure_sessions_cwd_dir`, and `session::session_dir`). The files of the pager are
# in `<home>/pager-cache/<session id>`, and the pager removes them when it deletes a session.
[gates.session_disk_reads]
crates = [
    "codegen/pi-pager",
    "codegen/pi-pager-bin",
    "codegen/pi-pager-render",
    "codegen/pi-shared",
]
patterns = [
    "list_summaries",
    "resolve_local_session",
    "session_exists_for_cwd",
    "resumed_session_sandbox_profile",
    "local_summaries_for_cwd_sync",
    "session::storage",
    "persistence::session_dir",
    'join("sessions")',
    "sessions_cwd_dir",
    "session::session_dir",
]

[graph]
package = "pi-pager-bin"

# Ceiling for the number of unique packages in `cargo tree -p pi-pager-bin --target <triple>`.
[graph.max_nodes]
# Measured on the Linux runner (TUI CI run 37379203134, commit 0e71894): 980, down from 995 after
# the unused-dependency sweep and the removal of pi-memory / pi-fsnotify. Then 970 (plan r16: ten
# packages left when `pi-shell` dropped the dependencies that no source file named: `pi-workflow`
# and nine registry packages; one local run on Linux). A new dependency has to lower the count
# elsewhere or raise this number on purpose. Then 965 (the removal of `pi-update`: it left, and
# with it `indicatif`, `console` and `unit-prefix`; one local run on Linux). Then 954 (phase D.1:
# `async-openai` and ten packages that only it used left; one local run on Linux, 965 on the same
# base without the change). Phase D.3 (r38) left it at 954: it removed code and eight dependency
# edges of three crates, and every package still has another user.
x86_64-unknown-linux-gnu = 954

[check]
# Consumer build: everything that ships (`zypi`, the minimal pager).
packages = ["pi-pager-bin", "pi-pager-minimal"]
# Warning ceiling across those packages. Linux and macOS both show 0: the crate-root
# `#![allow(dead_code, ...)]` attributes are gone (plan A.4) and the code they hid was deleted.
max_warnings = 0
# `cargo check --workspace --tests --keep-going` type-checks every crate's tests, which is where
# Linux-only cfg code that macOS never compiled would break.
workspace_tests = true
# pi-fast-worktree: lib tests do not compile at HEAD (`nfs::confined::tests::plant_journal`).
workspace_tests_exclude = ["pi-fast-worktree"]
# The first Linux run was green (0 errors).
enforce_workspace_tests = true

[test]
# "nextest" (cargo-nextest, one process per test) or "cargo" (libtest, all tests of a binary as
# threads of one process). The vendored tests were written for nextest, and some of them are
# reliable only under it (docs/PLAN/PLAN-RUST-AGENT-RUNTIME-REMOVAL.md, sections 10.20 and
# 10.21). The command line `--runner` takes the other one. nextest counts the ignored tests and
# the tests that `skip` removes together as skipped, and it runs no doctests (these suites select
# explicit targets, so `cargo test` did not run them either).
runner = "nextest"
# The first Linux run passed every suite with 0 failures, so unexpected failures now block.
enforce = true
timeout_minutes = 60
# Several pager tests assert colour / cursor output and need a capable terminal environment.
# The home / agent / sandbox variables are unset so a developer's shell cannot change results
# (`PI_HOME` outranks the `GROK_HOME` that the config-isolation tests set for themselves).
unset_env = ["NO_COLOR", "PI_HOME", "GROK_HOME", "PI_AGENT_COMMAND", "PI_PYTHON", "GROK_SANDBOX"]

[test.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

# `reference_passed` is the Linux CI result of the last recorded run (TUI CI run 37389455793,
# commit ac1d3ff; docs/baselines/tui.md); the summary flags a run that deviates by more than 5 %.
# `min_passed` (floor) is that run minus a few percent: deleting dead code legitimately deletes
# its tests, but a drop below the floor has to be a deliberate edit of this file. Both numbers
# are measured on Linux; macOS runs a handful of platform-specific tests more or fewer.

[[test.suite]]
package = "pi-shell"
targets = ["--lib", "--test", "sandbox_requirements_pin", "--test", "test_config_update_isolation"]
# 1,056 before plan decision 10 (r15) deleted the session store of `pi-shell` and the state types
# that only it used. The deleted files held 202 tests (one of them compiles only on macOS), and 9
# new ones came (the title helpers and the verdict): 1,056 - 201 + 9 = 864 on Linux. Then plan r16
# deleted `session::worktree` (24 tests, Unix only), `session::helpers` (2) and
# `util::config::worktree` (1), and added 1 (a `[storage]` section is reported as unrecognized):
# 864 - 24 - 2 - 1 + 1 = 838 on Linux (one local run). The ten reference numbers add up to 8,490.
# Then the dead modules and loaders left (plan decision 10 and phase D.8) and took 54 tests with the
# code: 19 of the folder-trust gate (nothing calls it), 9 of the MCP loaders, 7 of the Claude import
# marker, 6 of `config::reloader`, 6 of `session::telemetry`, 3 of the plugin-config resolver, 2 of
# `session::events`, 1 of `auth::flow` and 1 of `upload::turn`. None was added: 838 - 54 = 784 on
# Linux (one local run; 8,436 over the ten suites, the other nine unchanged). The floor keeps the
# same distance as before (18).
# Then plan B.3 moved `extensions::notification` and `extensions::prompt_meta` (42 tests) to
# `pi-acp-lib`: 784 - 42 = 742 (one local run on Linux; the floor keeps the distance of 18).
# Then phase D.3 (r38) deleted the xAI features that cannot work with the Python agent and took 132
# tests with the code: 43 of the client of `remote/`, 16 of `managed_config`, 6 of `agent::models`,
# 9 of the credential provider, 30 of `auth::{attribution, recovery}`, 9 of `AuthManager` methods
# that only these called, 7 of the remote-settings resolvers, 2 of `tier`, and 10 config tests of
# `ModelEntry` and of the internal OTLP endpoint resolvers: 742 - 132 = 610 on Linux (one local
# run; the floor keeps the distance of 18). Then +2 for the launch resolver of Auto (Auto design,
# PR 3): the two pure tests of `auto_launch_from_selection`: 610 + 2 = 612 (one local run on Linux).
reference_passed = 612
min_passed = 594

[[test.suite]]
package = "pi-pager"
targets = [
    "--lib",
    "--test",
    "settings_e2e",
    "--test",
    "grok_home_paths",
    "--test",
    "selection_model_public_api",
    # The pager's ACP client against the real Python agent (plan 0.3). It needs a Python that has
    # pi_agent_cli installed: PI_E2E_PYTHON names it, and PI_E2E_REQUIRED=1 (set by tui-ci.yml and
    # tui-e2e.yml) makes a missing one a failure; without either the tests say so and pass, so a
    # developer who has no such Python can still run the manifest.
    "--test",
    "python_agent_e2e",
    # The guide pages under pi-pager/docs/user-guide name no stale product (plan D.6).
    "--test",
    "user_guide_pages",
]
