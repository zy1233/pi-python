name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages (dev)
        run: pip install -e ".[dev]" -e "./packages/pi-agent-harness" -e "./packages/pi-agent-cli"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: |
          pip install "ruff==0.16.0"
          ruff check .
          ruff format --check .

  build:
    name: Build Python packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build pi-agent-core
        run: python -m build --outdir dist/

      - name: Build pi-agent-harness
        run: python -m build --outdir dist/ packages/pi-agent-harness

      - name: Build pi-agent-cli
        run: python -m build --outdir dist/ packages/pi-agent-cli

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-tui:
    name: Build TUI binary (Linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tui/target
          key: tui-release-${{ runner.os }}-${{ hashFiles('tui/Cargo.lock') }}
          restore-keys: tui-release-${{ runner.os }}-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"

      - name: Build zypi (release-dist)
        working-directory: tui
        run: cargo build --profile release-dist -p pi-pager-bin

      - name: Prepare binary artifact
        run: |
          cp tui/target/release-dist/zypi zypi-linux-x86_64
          chmod +x zypi-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: tui-binary
          path: zypi-linux-x86_64

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [build, build-tui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: tui-binary
          path: tui-bin/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for current version from CHANGELOG.md
          version="${{ steps.version.outputs.version }}"
          body=$(awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$body" > /tmp/release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "pi-python ${{ github.ref_name }}" \
            --notes-file /tmp/release-body.md \
            dist/* tui-bin/*
