name: CI

# Ruff and pytest read Python. A change that touches only the paths below cannot change their result:
# the extension has its own workflow (vscode-extension.yml), `docs/` is outside Ruff (`extend-exclude`)
# and outside `testpaths`, and no Python test reads either folder. GitHub runs this workflow when ANY
# changed file is left in the list, so a change that also touches another file still runs it.
# The order matters: a `!` pattern takes a file out, and the last pattern puts every Python file back
# (Ruff reads the three Python helpers inside `vscode/`). No check is required on `main`, so a run that
# is skipped blocks no merge.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!vscode/**"
      - "!docs/**"
      - "!.github/workflows/vscode-extension.yml"
      - "**/*.py"
  pull_request:
    paths:
      - "**"
      - "!vscode/**"
      - "!docs/**"
      - "!.github/workflows/vscode-extension.yml"
      - "**/*.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.0"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages (dev)
        run: pip install -e ".[dev]" -e "./packages/pi-agent-harness" -e "./packages/pi-agent-cli" -e "./packages/pi-web-access" -e "./packages/pi-goal-x" -e "./packages/pi-dynamic-workflows" -e "./packages/pi-mcp"
      - name: Run tests
        run: pytest -v
