name: Publish Blog Post

# Turns an owner-authored GitHub Issue (labeled `publish-blog`) or a manual
# `workflow_dispatch` submission into a Markdown file under
# `web/src/content/blog/<slug>.md` and opens a Pull Request.
#
# Merging the PR triggers Cloudflare Workers Builds to rebuild and deploy
# https://zycode.dev automatically — no web code edits and no manual deploy.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      title:
        description: Article title
        required: true
        type: string
      slug:
        description: URL slug (lowercase ASCII letters, digits, hyphens; leave blank to auto-generate)
        required: false
        type: string
      lang:
        description: Article language
        required: true
        default: zh
        type: choice
        options:
          - zh
          - en
      description:
        description: Short 1-2 sentence summary
        required: true
        type: string
      tags:
        description: Comma-separated tags (optional)
        required: false
        type: string
      translation:
        description: Counterpart translation slug (optional)
        required: false
        type: string
      body:
        description: Article body in Markdown
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    name: Create blog post PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.label.name == 'publish-blog' &&
        github.event.issue.user.login == github.repository_owner &&
        github.actor == github.repository_owner
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version

      - name: Generate Markdown post
        id: post
        env:
          BLOG_MODE: ${{ github.event_name == 'issues' && 'issue' || 'dispatch' }}
          BLOG_TITLE: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.title }}
          BLOG_SLUG: ${{ github.event_name == 'issues' && '' || inputs.slug }}
          BLOG_LANG: ${{ github.event_name == 'issues' && '' || inputs.lang }}
          BLOG_DESCRIPTION: ${{ github.event_name == 'issues' && '' || inputs.description }}
          BLOG_TAGS: ${{ github.event_name == 'issues' && '' || inputs.tags }}
          BLOG_TRANSLATION: ${{ github.event_name == 'issues' && '' || inputs.translation }}
          BLOG_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.body }}
          BLOG_ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: node web/scripts/issue-to-post.mjs

      - name: Commit post to branch and open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          POST_SLUG: ${{ steps.post.outputs.slug }}
          POST_FILE: ${{ steps.post.outputs.file }}
          POST_TITLE: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.title }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: |
          set -euo pipefail
          branch="blog/${POST_SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add "${POST_FILE}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "blog: publish ${POST_SLUG}"
          git push --force-with-lease origin "${branch}"

          pr_body="Adds \`${POST_FILE}\` for \`https://zycode.dev/blog/${POST_SLUG}/\`."
          if [ -n "${ISSUE_NUMBER}" ]; then
            pr_body="${pr_body}"$'\n\n'"Closes #${ISSUE_NUMBER}."
          fi

          existing=$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url // empty')
          if [ -n "${existing}" ]; then
            echo "url=${existing}" >> "${GITHUB_OUTPUT}"
          else
            url=$(gh pr create --base main --head "${branch}" --title "blog: ${POST_TITLE}" --body "${pr_body}")
            echo "url=${url}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Comment PR link on issue
        if: github.event_name == 'issues' && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh issue comment "${ISSUE_NUMBER}" --body "Blog post PR is ready: ${PR_URL}"
