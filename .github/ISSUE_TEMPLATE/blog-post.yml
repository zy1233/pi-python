name: Blog Post
description: Draft a blog post for zycode.dev/blog (add the `publish-blog` label to open a PR automatically)
title: ""
labels: ["blog"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below and add the **`publish-blog`** label when ready.
        Only issues authored by the repository owner trigger the automated pull request workflow.
  - type: input
    id: slug
    attributes:
      label: Slug
      description: URL segment under `/blog/<slug>/` (lowercase letters, digits, hyphens). Leave blank to auto-generate.
      placeholder: release-1-2-notes
    validations:
      required: false
  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Primary language of this post.
      options:
        - zh
        - en
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: Short 1-2 sentence summary for the blog list, RSS feed, and social cards.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags (optional).
      placeholder: release, architecture
    validations:
      required: false
  - type: input
    id: translation
    attributes:
      label: Translation slug (optional)
      description: Slug of the counterpart EN/ZH post, if one exists.
    validations:
      required: false
  - type: textarea
    id: content
    attributes:
      label: Content
      description: Article body in Markdown.
      placeholder: Write your article here...
    validations:
      required: true
