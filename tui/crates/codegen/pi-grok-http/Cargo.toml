[package]
license = "Apache-2.0"
name = "pi-grok-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pi-grok-auth = { workspace = true, features = ["middleware"] }
pi-grok-extra-ca = { workspace = true }
pi-grok-sampler = { path = "../pi-grok-sampler" }
pi-grok-telemetry = { workspace = true }
pi-grok-version = { workspace = true }
pi-grok-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[lints]
workspace = true
