[package]
license = "Apache-2.0"
name = "pi-shell"
version = "1.0.8"
edition.workspace = true

[features]
default = []
dhat-heap = ["dep:dhat"]
# Loom model-checking for src/auth/manager/lock/flock_wait.rs; test-only
# (compile_error!-guarded). Run in release (debug overflows loom's stacks):
#   cargo test --release --features loom -p pi-shell --lib flock_wait::loom -- --test-threads=1
loom = ["dep:loom"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`.
test-support = []
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
# CI default set (preferred over cargo `default` for hermetic CI builds):
# `config-docs` is on this set (not cargo `default`) so hermetic lib tests
# parse the committed config-reference page.
config-docs = []
default-bazel = [
    "local-workspace",
    "test-support",
    "config-docs",
]

[dependencies]
dunce = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
pi-announcements = { workspace = true }
pi-version = { workspace = true }

async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
loom = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
dirs = "6"
toml = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
obfstr = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
backon = { workspace = true }
urlencoding = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
arc-swap = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
strum = { workspace = true }
pi-fast-worktree = { path = "../pi-fast-worktree", features = ["metadata"] }

pi-shell-base = { workspace = true }
pi-shell-terminal = { workspace = true }
pi-shared = { workspace = true }
pi-status-line = { workspace = true }
pi-sandbox = { path = "../pi-sandbox", default-features = false }
pi-chat-state = { path = "../pi-chat-state" }
# Segment markdown rendering + the `compaction/` store path convention.
pi-compaction-transcript = { workspace = true }
pi-extra-ca = { workspace = true }
pi-token-estimation = { workspace = true }
pi-sampling-types = { path = "../pi-sampling-types" }
pi-tools = { path = "../pi-tools" }
pi-tty-utils = { workspace = true }
pi-workflow = { path = "../pi-workflow" }
pi-system-power = { workspace = true }
pi-workspace = { workspace = true }
pi-subagent-resolution = { path = "../pi-subagent-resolution" }
pi-agent = { path = "../pi-agent" }
pi-bundle = { workspace = true }
pi-config = { workspace = true }
pi-config-types = { workspace = true }
pi-file-utils = { path = "../pi-file-utils" }
pi-session-events = { workspace = true }
pi-auth = { workspace = true, features = ["middleware"] }
pi-telemetry = { workspace = true }
pi-http = { workspace = true }
pi-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
fs2 = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
# The fixture that builds a `[ui.status_line]` section field by field.
pi-status-line = { workspace = true, features = ["test-support"] }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside pi-bundle without this feature.
pi-bundle = { workspace = true, features = ["test-support"] }
pi-workspace = { workspace = true, features = ["test-support"] }
pi-config = { workspace = true, features = [] }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
pi-shell-base = { workspace = true, features = ["test-support"] }
pi-test-support = { workspace = true, features = [] }
pi-test-utils = { workspace = true }
# Mock HTTP servers and tracing capture used by in-crate unit tests.
axum = { workspace = true, features = ["ws", "multipart"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
