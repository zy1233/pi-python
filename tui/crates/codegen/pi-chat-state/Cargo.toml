[package]
license = "Apache-2.0"
name = "pi-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for pi agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
pi-compaction-transcript = { workspace = true }
pi-compaction = { path = "../../common/pi-compaction" }
pi-sampling-types = { path = "../pi-sampling-types" }
pi-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
