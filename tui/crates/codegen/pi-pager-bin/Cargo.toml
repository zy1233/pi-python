[package]
name = "pi-pager-bin"
version = "1.0.8"
edition.workspace = true
license = "Apache-2.0"
authors = ["pi"]
default-run = "zypi"

# Composition-root binary for the zypi TUI. The artifact is named `zypi`.
# This package exists so the binary can link both the pager library and the
# optional `pi-pager-minimal` render mode: `minimal` depends on
# `pi-pager`, so the pager library cannot depend back on it (cargo cycle).
# The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "zypi"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
pi-pager = { path = "../pi-pager" }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
pi-pager-minimal = { path = "../pi-pager-minimal" }

# Agent runtime + leader/stdio/headless entry points.
pi-shell = { workspace = true }
pi-update = { path = "../pi-update" }
pi-version = { workspace = true }
pi-telemetry = { workspace = true }
pi-workspace = { workspace = true }
pi-crash-handler = { path = "../pi-crash-handler" }
pi-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
pi-tty-utils = { workspace = true }
# `collect_crashed()` for the startup crash notice.
pi-active-sessions = { workspace = true }
pi-config = { workspace = true }
pi-sandbox = { path = "../pi-sandbox", default-features = false }
pi-extra-ca = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
sandbox-enforce = ["pi-pager/sandbox-enforce"]
local-workspace = ["pi-pager/local-workspace"]
release-dist = [
    "pi-pager/release-dist",
    ]
