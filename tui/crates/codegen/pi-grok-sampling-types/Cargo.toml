[package]
license = "Apache-2.0"
name = "pi-grok-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the pi sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
pi-circuit-breaker = { workspace = true }
pi-grok-compaction = { path = "../../common/pi-grok-compaction" }
pi-grok-tools = { path = "../pi-grok-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
