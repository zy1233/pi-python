[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-harness-lc"
version = "0.2.0"
description = "AgentHarness runtime, session storage, and orchestration layer for pi-agent-core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "zy1233", email = "zy1233@users.noreply.github.com" },
]
keywords = ["agent", "llm", "harness", "session", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pi-agent-core-lc==0.2.0",
    "pathspec>=0.12",
    "pydantic>=2.0",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/zy1233/pi-python"
Repository = "https://github.com/zy1233/pi-python"
Issues = "https://github.com/zy1233/pi-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.uv.sources]
pi-agent-core-lc = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pi_agent_harness"]
