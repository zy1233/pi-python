# Copy to ~/.pi-python/agent.toml (or set PI_HOME).
# Python ACP agent settings ONLY — do not duplicate these keys in config.toml
# (the Rust TUI parses config.toml as grok-shell config).
# LLM keys are read from environment variables — never put secrets in this file.

permission = "ask" # ask | auto | always-approve

thinking_level = "off" # off | minimal | low | medium | high | xhigh
max_turns = 50

[model]
provider = "deepseek"
id = "deepseek-ai/DeepSeek-V4-Flash"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "REAL_LLM_API_KEY" # key for `provider` only; other providers use their own (e.g. ANTHROPIC_API_KEY)

[skills]
# ".pi/skills" is relative to the project, so it loads only for a trusted project (see [extensions]).
paths = ["~/.pi-python/skills", ".pi/skills"]

[agent]
# Used by the Rust TUI when PI_AGENT_COMMAND is unset (Windows: prefer a venv python.exe).
command = "python -m pi_agent_cli"

[prompt]
# no_context_files = false
# custom_system_prompt = "You are a helpful assistant."
# custom_system_prompt_file = "~/.pi-python/agent/SYSTEM.md"
# append_system_prompt = "Always run tests after edits."
# append_system_prompt_file = "~/.pi-python/agent/APPEND_SYSTEM.md"

[git]
# A `git status` snapshot (branch name and the paths of changed and untracked files) is added to
# the system prompt at the start of a session, so it is sent to the model provider with every
# request. Set enabled = false if such names are sensitive.
# enabled = true
# timeout_seconds = 2   # one budget for the whole snapshot (up to four git commands), not per command
# max_status_lines = 40

[extensions]
# Project trust. Extensions in <project>/.pi-python/extensions run arbitrary Python as soon as a
# session opens, and the project's .pi/SYSTEM.md, .pi/APPEND_SYSTEM.md and project-relative
# [skills] paths decide what the model is told, so all of them are skipped unless you trust the
# project. Only this file is read for that decision (never a config inside the project).
# Installed extension packages, ~/.pi-python/extensions, AGENTS.md and absolute or ~ skills paths
# are not affected.
# trusted_projects = ["~/work/my-repo"] # absolute or ~ paths; subdirectories are trusted too
#                                       # (Windows: use forward slashes, e.g. "C:/work/my-repo")
# trust_project_extensions = false      # true trusts every project
# One-off alternatives: --trust-project-extensions, or PI_TRUST_PROJECT_EXTENSIONS=1
