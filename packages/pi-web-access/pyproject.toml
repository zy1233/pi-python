[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-web-access-py"
version = "0.1.0"
description = "Web search and URL fetching extension for pi-python (port of pi-web-access)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "zy1233", email = "zy1233@users.noreply.github.com" },
]
keywords = ["agent", "web-search", "fetch", "pi", "extension"]
dependencies = [
    "pi-agent-core-lc>=0.3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
readability = ["trafilatura>=1.12"]
brave = []
tavily = ["tavily-python>=0.5"]

[project.entry-points."pi_agent.extensions"]
pi-web-access = "pi_web_access:activate"

[project.urls]
Homepage = "https://github.com/zy1233/pi-python"
Repository = "https://github.com/zy1233/pi-python"

[tool.hatch.build.targets.wheel]
packages = ["pi_web_access"]

[tool.uv.sources]
pi-agent-core-lc = { workspace = true }
