[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-codemode-py"
version = "1.0.0"
description = "Programmatic tool orchestration and deferred tool discovery extension for pi-python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "zy1233", email = "zy1233@users.noreply.github.com" },
]
keywords = ["agent", "codemode", "tool-search", "mcp", "pi", "extension"]
dependencies = [
    "pi-agent-core-lc>=1.0.0",
    "pydantic>=2.0",
]

[project.entry-points."pi_agent.extensions"]
pi-codemode = "pi_codemode:activate"

[project.urls]
Homepage = "https://github.com/zy1233/pi-python"
Website = "https://zycode.dev"
Repository = "https://github.com/zy1233/pi-python"

[tool.hatch.build.targets.wheel]
packages = ["pi_codemode"]

[tool.uv.sources]
pi-agent-core-lc = { workspace = true }
